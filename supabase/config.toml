# Supabase CLI configuration
# This file is used for local development and Edge Function deployments.
project_id = "env(SUPABASE_PROJECT_ID)"

# The media-upload function handles its own authentication (publishable key
# / user JWT / legacy anon key validation) and does not rely on the API
# gateway's JWT verification. This is required for the new
# sb_publishable_... / sb_secret_... API keys, which are not JWTs.
[functions.media-upload]
verify_jwt = false

# review-submit handles its own authentication for the same reasons as
# media-upload (publishable keys are not JWTs). Anonymous review submissions
# are Turnstile-gated inside the function.
[functions.review-submit]
verify_jwt = false

# review-manage verifies the user JWT inside the function (it must distinguish
# "valid user token" from "public API key" itself). The gateway check would
# reject publishable-key CORS preflights anyway.
[functions.review-manage]
verify_jwt = false

# review-claim does its own JWT verification like review-manage — the caller's
# verified id and email drive the claim matching.
[functions.review-claim]
verify_jwt = false

# Email-link redirects (signup confirmation, password recovery) must land on
# the Vite dev server. site_url is the base Supabase falls back to when an
# email link has no redirect_to, so point it at the dev origin.
# Local stack only — remote projects set these in the Dashboard under
# Authentication → URL Configuration → Redirect URLs.
[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173/**",
  "http://127.0.0.1:5173/**",
  "http://localhost:4173/**",
]

# Reject signups from disposable email domains. The Postgres function is
# created by migration 031; on hosted projects (staging/prod) this hook must
# also be enabled in the Dashboard under Authentication → Hooks.
[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/hook_reject_disposable_email"
