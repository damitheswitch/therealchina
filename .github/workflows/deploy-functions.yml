# Deploys every Edge Function when code lands on staging (trc-staging) or
# master (prod), so a merged function fix can't sit undeployed. Migrations are
# not pushed here; deployment is blocked until they have been applied.
# Requires the SUPABASE_ACCESS_TOKEN repo secret (owner step). Without it this
# workflow is a no-op.
name: Deploy Edge Functions

on:
  push:
    branches: [staging, master]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - 'supabase/migrations/**'
      - 'scripts/check_deployment_migrations.mjs'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

concurrency:
  group: deploy-functions-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # staging → trc-staging, master → TRC prod.
      PROJECT_REF: ${{ github.ref_name == 'master' && 'hfinkagueeojyyrpauav' || 'pthlbalvkunugifbzgzk' }}
    steps:
      - name: Reject unsupported deployment branches
        run: |
          case "$GITHUB_REF" in
            refs/heads/staging|refs/heads/master) ;;
            *) echo "Deploy only from staging or master"; exit 1 ;;
          esac
      - name: Check for access token
        id: token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN not set, skipping (owner setup pending)"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.token.outputs.present == 'true'
        with:
          version: latest
      - uses: actions/setup-node@v4
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 22
      - name: Require all migrations on the deployment target
        if: steps.token.outputs.present == 'true'
        env:
          SUPABASE_PROJECT_ID: ${{ env.PROJECT_REF }}
        run: |
          set -o pipefail
          supabase migration list --project-ref "$PROJECT_REF" |
            node scripts/check_deployment_migrations.mjs
      - name: Deploy all functions
        if: steps.token.outputs.present == 'true'
        # config.toml reads project_id from this variable; it must never be
        # left pointing at another project.
        env:
          SUPABASE_PROJECT_ID: ${{ env.PROJECT_REF }}
        run: supabase functions deploy --project-ref "$PROJECT_REF"
