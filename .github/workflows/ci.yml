name: CI

on:
  push:
    branches: [master, staging]
  pull_request:
    branches: [master, staging]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # Build pipeline exports prerender data — the committed fixture
          # stands in for Supabase in CI.
          TRC_EXPORT_FIXTURE: '1'

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check and test Edge Functions
        run: |
          for dir in supabase/functions/*/; do
            # Skip shared-module directories (e.g. _shared/) — they hold
            # libraries imported by the functions, not deployable functions
            # with their own index.ts.
            if [ ! -f "${dir}deno.json" ] || [ ! -f "${dir}index.ts" ]; then
              continue
            fi
            deno check --config "${dir}deno.json" "${dir}index.ts"
            # Only run tests when the directory actually contains test files
            # (Deno convention: *_test.ts / *_test.tsx). Avoids "No test
            # modules found" failures on functions that don't have tests yet.
            tests=$(find "$dir" -maxdepth 1 -type f \( -name '*_test.ts' -o -name '*_test.tsx' \) -print -quit)
            if [ -n "$tests" ]; then
              deno test --config "${dir}deno.json" "$dir"
            fi
          done
          # Shared modules still get type-checked and tested, against their
          # own import map in _shared/deno.json.
          if [ -d supabase/functions/_shared ]; then
            deno check --config supabase/functions/_shared/deno.json supabase/functions/_shared/*.ts
            tests=$(find supabase/functions/_shared -maxdepth 1 -type f \( -name '*_test.ts' -o -name '*_test.tsx' \) -print -quit)
            if [ -n "$tests" ]; then
              deno test --config supabase/functions/_shared/deno.json supabase/functions/_shared/
            fi
          fi
