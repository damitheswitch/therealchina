name: CI

on:
  push:
    branches: [master, staging]
  pull_request:
    branches: [master, staging]
  workflow_dispatch:

jobs:
  # Lint, format, types, unit tests, build + prerender, and the SEO validator.
  # (Was split across ci.yml and seo.yml, which ran the same build twice.)
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - name: Build + prerender
        run: npm run build
        env:
          # Committed fixture stands in for Supabase. CI builds are never the
          # prod deploy, so the validator runs in noindex mode.
          TRC_EXPORT_FIXTURE: '1'
          TRC_INDEXABLE: '0'
      - name: SEO validator
        run: node scripts/validate_build.mjs
      - name: Lighthouse CI (warnings only, budgets enforced after data lands)
        if: github.event_name == 'pull_request'
        run: npx lhci autorun --config=lighthouserc.cjs || echo "::warning::lhci unavailable in this environment"

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check and test Edge Functions
        run: |
          for dir in supabase/functions/*/; do
            # Skip shared-module directories (e.g. _shared/) — they hold
            # libraries imported by the functions, not deployable functions
            # with their own index.ts.
            if [ ! -f "${dir}deno.json" ] || [ ! -f "${dir}index.ts" ]; then
              continue
            fi
            deno check --config "${dir}deno.json" "${dir}index.ts"
            # Only run tests when the directory actually contains test files
            # (Deno convention: *_test.ts / *_test.tsx). Avoids "No test
            # modules found" failures on functions that don't have tests yet.
            tests=$(find "$dir" -maxdepth 1 -type f \( -name '*_test.ts' -o -name '*_test.tsx' \) -print -quit)
            if [ -n "$tests" ]; then
              deno test --config "${dir}deno.json" "$dir"
            fi
          done
          # Shared modules still get type-checked and tested, against their
          # own import map in _shared/deno.json.
          if [ -d supabase/functions/_shared ]; then
            deno check --config supabase/functions/_shared/deno.json supabase/functions/_shared/*.ts
            tests=$(find supabase/functions/_shared -maxdepth 1 -type f \( -name '*_test.ts' -o -name '*_test.tsx' \) -print -quit)
            if [ -n "$tests" ]; then
              deno test --config supabase/functions/_shared/deno.json supabase/functions/_shared/
            fi
          fi

  # Rebuilds the database from every migration + seed.sql on a fresh local
  # Postgres, then runs the supabase/verify/*.sql probes. Catches migrations
  # that don't apply from scratch and RLS/grant regressions the probes cover.
  database:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_ID: ci
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start Postgres and apply migrations + seed
        run: |
          supabase db start
          supabase db reset --local
      - name: Run verification probes
        run: |
          status=0
          for f in supabase/verify/*.sql; do
            echo "== $f"
            out=$(docker exec -i "supabase_db_${SUPABASE_PROJECT_ID}" \
              psql -U postgres -d postgres -v ON_ERROR_STOP=1 < "$f") || { echo "$out"; status=1; continue; }
            echo "$out"
            if echo "$out" | grep -q 'FAIL'; then status=1; fi
          done
          exit $status
